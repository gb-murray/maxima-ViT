# Configuration for training a SWIN regression model.

paths:
  # Directory where the model checkpoint will be saved.
  output_dir: "C:/Users/gmurra12/projects/MAXIMA-ViT/models/swin/2026.7"

data:
  # Path to the HDF5 file containing the dataset.
  hdf5_path: "C:/Users/gmurra12/projects/MAXIMA-ViT/data/JHACARD00011_alpha_Al2O3_Eiger2Cdte_1M_68.h5"
  train_group: "train"
