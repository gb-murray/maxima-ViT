# XRD geometry training configuration. Paths are relative to the working directory.
seed: 42

paths:
  output_dir: models/PRISMS_XRD_2026.10
  artifact_name: prisms_xrd_2026.10.0.pth

data:
  # The target transform is fixed for the entire curriculum and is read from
  # this dataset's normalization group.
  normalization_source: synthetic_train
  datasets:
    synthetic_train:
      hdf5_path: data/PHAROS_alpha_Al2O3_Eiger2Cdte_1M_5K_02-09-2026.h5
      group: train
      randomize: true
      shuffle: true
    synthetic_validation:
      hdf5_path: data/PHAROS_alpha_Al2O3_Eiger2Cdte_1M_5K_02-09-2026.h5
      group: test
      randomize: false
      shuffle: false
    # experimental_train:
    #   hdf5_path: data/experimental_xrd.h5
    #   group: train
    #   randomize: false
    #   shuffle: true
    # experimental_validation:
    #   hdf5_path: data/experimental_xrd.h5
    #   group: validation
    #   randomize: false
    #   shuffle: false

experiment:
  name: alpha_Al2O3_Eiger2Cdte_1M
  detector: Eiger2Cdte_1M
  # The fixed source spectrum includes both K-alpha lines.
  wavelengths_m: [5.121197787410171e-11, 5.1655146e-11]
  fixed_parameters:
    rot3: 0.0
  metadata:
    calibrant: alpha_Al2O3

preprocessing:
  lower_percentile: 0.1
  upper_percentile: 99.9
  mask_intensity: 4294967295

model:
  family: swin
  backbone: microsoft/swin-base-patch4-window12-384-in22k
  feature_dim: 1024
  head_hidden_dim: 512
  image_size: 1056
  dropout: 0.1

uncertainty:
  estimator: mc_dropout
  samples: 32
  stochastic_scope: head

training:
  batch_size: 8
  num_workers: 0
  pin_memory: true
  mixed_precision:
    enabled: true
    dtype: float16
  stages:
    - name: head_warmup
      regime: deterministic
      dataset: synthetic_train
      validation_dataset: synthetic_validation
      trainable: head
      loss: l1
      weights: [1, 1, 1, 1, 1]
      learning_rate: 1.0e-4
      epochs: 20
      early_stopping:
        patience: 20
        min_delta: 0.0
        restore_best: true
    - name: translations
      regime: deterministic
      dataset: synthetic_train
      validation_dataset: synthetic_validation
      trainable: all
      loss: l1
      weights: [1, 1, 1, 0, 0]
      learning_rate: 2.0e-5
      epochs: 100
      early_stopping:
        patience: 20
        min_delta: 0.0
        restore_best: true
    - name: rotations
      regime: deterministic
      dataset: synthetic_train
      validation_dataset: synthetic_validation
      trainable: all
      loss: l1
      weights: [0.1, 0.1, 0.1, 1, 1]
      learning_rate: 2.0e-5
      epochs: 100
      early_stopping:
        patience: 20
        min_delta: 0.0
        restore_best: true
    - name: finetune
      regime: deterministic
      dataset: synthetic_train
      validation_dataset: synthetic_validation
      trainable: head
      loss: huber
      huber_delta: 0.1
      weights: [1, 1, 1, 1, 1]
      learning_rate: 1.0e-6
      epochs: 1000
      early_stopping:
        patience: 20
        min_delta: 0.0
        restore_best: true
    - name: probabilistic_head
      regime: probabilistic
      dataset: synthetic_train
      validation_dataset: synthetic_validation
      trainable: head
      loss: gaussian_nll
      learning_rate: 1.0e-6
      epochs: 100
      early_stopping:
        patience: 20
        min_delta: 0.0
        restore_best: true
